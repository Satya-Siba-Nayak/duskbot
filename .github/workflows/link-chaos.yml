# the link service's chaos run (apps/link-service/chaos): two real nodes, the real agent and the app's relay code,
# broken one way at a time. needs only node and openssl. the short set on changes to the relay's code; the whole run
# by hand (workflow_dispatch with full) or every sunday.
name: Link chaos

on:
  workflow_dispatch:
    inputs:
      full:
        description: every scenario (about 40 minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: link-chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: link chaos (${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Chaos run
        run: node apps/link-service/chaos/run.mjs ${{ (github.event_name == 'schedule' || inputs.full) && '' || '--quick' }} --md "$GITHUB_STEP_SUMMARY" --json chaos.json
      - name: Keep the matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-chaos
          path: chaos.json
          if-no-files-found: ignore
